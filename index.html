.fade{animation:f .2s ease}@keyframes f{from{opacity:0;transform:translateY(4px)}}
.sub.done span{text-decoration:line-through;opacity:.55}

.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--acs);outline-offset:2px}

@media(min-width:768px){.ov{align-items:center}.sheet{border-radius:24px!important}}

.inp{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:11px 14px;font-size:14px;outline:none;color:var(--tx)}.inp:focus{border-color:var(--ac)}.dark .inp{color-scheme:dark}

@keyframes grow{from{width:44px;opacity:.6}}.sw{width:42px;height:24px;border-radius:99px;background:var(--tr);position:relative;flex:none;transition:.2s}.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}.sw.on{background:var(--ac)}.sw.on::after{left:21px}
.tinp{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:5px 8px;font-size:13px;color:var(--tx)}.dark .tinp{color-scheme:dark}
.grow{animation:grow .22s ease}.grow input:focus-visible{outline:none}.grow:focus-within{border-color:var(--ac)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 if(!t.tm24){const m=/(\d+):(\d+)\s*(AM|PM)/.exec(t.time||t.due||'');t.tm24=m?String((+m[1]%12)+(m[3]=='PM'?12:0)).padStart(2,'0')+':'+m[2]:'17:00'}
 if(t.done&&!t.doneOn)t.doneOn=iso(t.dday=='today'?0:t.day=='yesterday'?-1:0)};

let U=null,theme=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark',toured=false,lang=(navigator.language||'en').slice(0,2)=='it'?'it':'en';const seed=JSON.stringify({tasks,notes,log}),K='tudy.v2';
try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.tasks){tasks=d.tasks;notes=d.notes;log=d.log;U=d.U;theme=d.theme||theme;toured=!!d.toured;lang=d.lang||lang;owner=d.owner||null;dirty=!!d.dirty;avatar=d.avatar||null}}catch(e){}

 log.unshift([now(),t.done?'completed':'reopened',t.t]);render();}

function vToday(){
 const sel=selDate(),isT=sel==iso(0),td=tasks.filter(t=>t.date==sel),over=isT?tasks.filter(t=>!t.done&&t.date<sel):[],dn=td.filter(t=>t.done).length,pct=td.length?Math.round(dn/td.length*100):0;

function vTasks(){

 for(const [tb,set,arr] of [['tasks',remote.t,tasks],['notes',remote.n,notes]]){const del=[...set].filter(i=>!arr.some(x=>x.id==i));if(del.length){const r=await sb.from(tb).delete().in('id',del);if(r.error)throw r.error}}
 remote={t:new Set(tasks.map(x=>x.id)),n:new Set(notes.map(x=>x.id))};

let pushOk=false,pushBusy=false,ntMsg='';
const setNt=m=>{ntMsg=m;const o=$('#ntest');if(o)o.textContent=m};
const keyBytes=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s);return Uint8Array.from(r,c=>c.charCodeAt(0))};
async function pushSub(){if(pushBusy||!sb||!sess||permSt()!='granted'||!('PushManager'in window))return;pushBusy=true;
 try{const reg=await navigator.serviceWorker.ready;let s=await reg.pushManager.getSubscription();
  if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:keyBytes(VAPID_PUB)});
  const j=s.toJSON(),r=await sb.from('push_subs').upsert({endpoint:j.endpoint,user_id:sess.user.id,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:'endpoint'});
  if(r.error)throw r.error;if(!pushOk){pushOk=true;if(S.view=='settings')render()}}catch(e){console.warn('push',e)}finally{pushBusy=false}}
async function pushUnsub(){try{const reg=await navigator.serviceWorker.ready,s=await reg.pushManager.getSubscription();if(s){if(sb&&sess)await sb.from('push_subs').delete().eq('endpoint',s.endpoint);await s.unsubscribe()}}catch(e){}pushOk=false}
async function pushTest(){if(!pushOk||!sb){sysNote({k:'test',h:'tudy',b:tx('This is a test reminder.')});return}
 setNt(tx('Sending…'));
 try{const r=await sb.functions.invoke('tudy-push',{body:{test:true}});if(r.error||!r.data||!r.data.sent)throw r.error||new Error('none');setNt(tx('Sent. You can close tudy: the next reminders will arrive anyway.'))}
 catch(e){console.warn(e);sysNote({k:'test',h:'tudy',b:tx('This is a test reminder.')});setNt(tx('The server did not answer yet, so this test came from the app. Check the Supabase setup.'))}}

 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl&&!reloaded){reloaded=true;location.reload()}});
